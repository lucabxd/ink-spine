// ---------------------------------------------------------------------------
// Permanent site library (Supabase-backed)
//
// Books uploaded by an admin are stored as:
//   - the extracted text  -> Supabase Storage bucket "book-content"
//   - the cover image     -> Supabase Storage bucket "book-covers" (optional)
//   - metadata + a pointer to both of the above -> the "books" Postgres table
// Row Level Security on "books" and on both buckets is what actually enforces
// "only admins can write" - it isn't just a hidden button in the UI. See the
// SQL you ran for the exact policies.

async function sha256Hex(text) {
  const bytes = new TextEncoder().encode(text);
  const digest = await crypto.subtle.digest("SHA-256", bytes);
  return Array.from(new Uint8Array(digest)).map((b) => b.toString(16).padStart(2, "0")).join("");
}

function dataUrlToBlob(dataUrl) {
  const [header, base64] = dataUrl.split(",");
  const mime = (header.match(/data:(.*?);base64/) || [, "image/jpeg"])[1];
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}

async function findSiteBookByHash(hash) {

async function uploadBookContentToStorage(text, hash) {
  const path = hash + ".txt";
  const { error } = await sb.storage.from("book-content").upload(path, new Blob([text], { type: "text/plain" }), {
    upsert: false,
    contentType: "text/plain"
  });
  if (error && !/already exists/i.test(error.message || "")) throw error;
  return path;
}
async function uploadBookCoverToStorage(dataUrl, hash) {
  const blob = dataUrlToBlob(dataUrl);
  const ext = blob.type.split("/")[1] || "jpg";
  const path = hash + "-" + Date.now() + "." + ext;
  const { error } = await sb.storage.from("book-covers").upload(path, blob, { upsert: false, contentType: blob.type });
  if (error) throw error;
  return path;
}
function publicBookContentUrl(path) {
  return sb.storage.from("book-content").getPublicUrl(path).data.publicUrl;
}

  return sb.storage.from("book-covers").getPublicUrl(path).data.publicUrl;
}

  if (error) throw error;
  if (book.storage_path) await sb.storage.from("book-content").remove([book.storage_path]).catch(() => {});
  if (book.cover_path) await sb.storage.from("book-covers").remove([book.cover_path]).catch(() => {});

// Converts a raw Supabase "books" row into the {title, author, cover, content, ...}
// shape the existing reader UI already expects, with `content` left unloaded
// (fetched on demand when the reader actually opens the book).
function siteRowToBook(row) {
  return {
    id: row.id,
    title: row.title,
    author: row.author,
    badge: row.badge || "",
    desc: row.description || "",
    cover: row.cover_path ? publicBookCoverUrl(row.cover_path) : null,
    content: null,
    _storagePath: row.storage_path,
    _isSiteBook: true,
    shelf_id: row.shelf_id,
    shelf_title: row.shelf_title
  };
}
function mergeSiteBooksIntoShelves(prevShelves, rows) {
  let next = prevShelves.map((s) => ({ ...s, books: s.books.filter((b) => !b._isSiteBook) }));
  for (const row of rows) {
    const book = siteRowToBook(row);
    const idx = next.findIndex((s) => s.id === row.shelf_id);
    if (idx === -1) {
      next = [...next, { id: row.shelf_id, title: row.shelf_title || row.shelf_id, books: [book] }];
    } else {
      next = next.map((s, i) => i === idx ? { ...s, books: [...s.books, book] } : s);
    }
  }
  return next;
}

  try { localStorage.setItem(key, value); return true; } catch (err) { return false; }

function loadExtraScript(src, category) {
  if (!hasConsent(category)) return;
  if (document.querySelector('script[data-optional-src="' + src + '"]')) return;

  s.async = true;

  function applyCurlTransforms(progress, dir) {

    }

      setPageIndex((p) => Math.min(totalPages - 1, p + s));

// These are professional templates, not legal advice. Placeholders in square

function buildPrivacySections(cfg) {
  return [
    { h: "Who operates this website", p: [
      cfg.websiteName + " (\u201Cthe website\u201D, \u201Cwe\u201D, \u201Cus\u201D) is operated by " + cfg.companyName + ", " + cfg.address + ". If you have questions about this policy or how your information is handled, contact us at " + cfg.contactEmail + " or our data protection contact at " + cfg.privacyContact + "."
    ] },
    { h: "Information we collect", p: [
      "We only collect what the reading experience actually needs to work. Depending on how you use " + cfg.websiteName + ", that can include:",
    ], bullets: [
      "Account information - if you sign in as an administrator, a username and a password (stored as a one-way hash, never as plain text).",
      "Reading activity - the page you last had open in a book, so you can pick up where you left off.",
      "Bookmarks - pages you've chosen to bookmark within a book.",
      "Vocabulary/dictionary data - words you've looked up and chosen to save to your personal word list.",
      "Reading preferences - your chosen reading theme (Day/Sepia/Night) and whether auto-hide navigation is turned on.",
      "Uploaded documents - if an administrator uploads a book, the file's extracted text and any cover image become part of the library.",
      "Technical information - basic details your browser sends to any website you visit (such as browser type and screen size), used only to render the reader correctly."
    ] },
    { h: "What we do not collect", p: [
      "We do not collect payment information, government ID numbers, precise location data, or biometric data. We do not run advertising trackers. If that ever changes, this policy and the cookie categories below will be updated first, and - where the change requires it - we'll ask for your consent before anything new starts running."
    ] },
    { h: "Why we collect it", p: [
      "Everything above exists to make the reader work the way you'd expect: remembering your place in a book, keeping your bookmarks and saved words available next time, and applying your chosen theme. Administrator accounts exist so that only authorized people can manage the library."
    ] },
    { h: "How information is stored", p: [
      "Reading preferences, bookmarks, your saved-word list, and your last-read page are stored locally in your own browser (using a technology called \u201Clocal storage\u201D), not on a central server, unless a backend is added later. Administrator session state is kept only for your current browser session. See our Cookie Policy for the full technical breakdown of what's stored and why."
    ] },
    { h: "How information is protected", p: [
      "Administrator passwords are never stored or compared in plain text. Administrative actions (like deleting a book) require re-entering the administrator password and typing a confirmation phrase. We rely on your browser's own storage security; anyone with physical or remote access to your device could potentially read locally stored data, the same as with any website."
    ] },
    { h: "How long information is retained", p: [
      "Local reading data (theme, bookmarks, last page, saved words) stays in your browser until you clear it or withdraw consent for preference storage (see Cookie Settings in the footer). Administrator activity logs are retained to support accountability for content-management actions and are limited to the most recent entries."
    ] },
    { h: "Sharing with third parties", p: [
      "We do not sell personal information. We do not share reading history, bookmarks, or vocabulary lists with anyone. See the next section for the limited third-party services the site relies on to function at all."
    ] },
    { h: "Third-party services used by this website", p: [
      "The reader loads a small number of third-party code libraries to function (for example, libraries that render PDF and Word documents, and that power the on-page interface). These are code libraries, not tracking services - they do not receive your reading activity. If a dictionary lookup feature calls an external dictionary API, only the word you look up is sent to that service, not your identity or reading history."
    ] },
    { h: "Your privacy rights", p: [
      "Depending on where you live, you may have some or all of the following rights over your information:"
    ], bullets: [
      "Right to be informed about what's collected and why (this page).",
      "Right to access the personal data associated with your account.",
      "Right to correction of inaccurate data.",
      "Right to object to certain processing, where applicable.",
      "Right to request deletion of your data, where applicable.",
      "Right to withdraw consent at any time for anything based on consent (see Cookie Settings)."
    ] },
    { h: "Data deletion and correction requests", p: [
      "You can clear locally stored reading data at any time by withdrawing preference consent in Cookie Settings, or by clearing your browser's site data. To request deletion or correction of any account-level information, contact us at " + cfg.contactEmail + "."
    ] },
    { h: "Children's privacy", p: [
      cfg.websiteName + " is not directed at children, and we do not knowingly collect personal information from children. If you believe a child has provided us with personal information, contact us at " + cfg.privacyContact + " and we will address it."
    ] },
    { h: "Cookies and similar technologies", p: [
      "This site does not use cookies. It uses browser local storage for the reading features described above. Full details are in our Cookie Policy, including how to control or withdraw consent for optional storage."
    ] },
    { h: "How we communicate updates", p: [
      "If we make a material change to this policy, we'll update the \u201CLast updated\u201D date below and, where appropriate, ask for renewed consent. Current version: Privacy Policy " + cfg.privacyVersion + ", last updated " + cfg.lastUpdated + "."
    ] },
    { h: "Contact us", p: [
      "Questions about this policy or your data: " + cfg.contactEmail + " (general) or " + cfg.privacyContact + " (data protection). Postal address: " + cfg.address + "."
    ] }
  ];
}
function buildTermsSections(cfg) {

    { h: "10. Prohibited Content", p: ["Content that is unlawful, infringing, defamatory, or that you do not have the rights to share must not be uploaded. Administrators may remove such content at their discretion."] },
