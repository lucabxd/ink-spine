          .mg-header-right { width: 100%; justify-content: space-between; gap: 10px !important; }
          .mg-search-box { flex: 1; }

        @media (max-width: 760px) {

          .mg-header-right > div:first-child { min-width: 0; flex-shrink: 1; }

          footer .mg-container { justify-content: flex-start !important; }

          .mmr-small::after { inset: -6px 0; }
          .mmr-card { min-width: 0; overflow-wrap: anywhere; }
          .mmr-card > button + div { flex-wrap: wrap; gap: 2px 8px !important; }
