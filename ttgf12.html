const SUPABASE_URL = "https://koyzsxvwdxsvxiriyvtp.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtveXpzeHZ3ZHhzdnhpcml5dnRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2MzIxOTMsImV4cCI6MjEwNTIwODE5M30._83YGlf3iU0fzakqns8r2f29G_vSctV0PeIO74rpdUg";

// Password rules for new accounts (the server enforces its own minimum too).
const COMMON_PASSWORDS = ["password", "password1", "password123", "12345678", "123456789", "1234567890", "qwerty123", "qwertyuiop", "iloveyou1", "letmein123", "admin12345", "welcome123", "changeme123", "abc12345", "11111111", "00000000"];
// Names people type (artist, note author, contact). Rejects blank and placeholder values such as "null".
const RESERVED_NAMES = ["null", "undefined", "nil", "none", "nan", "void"];
function isValidDisplayName(n) {
  const t = String(n == null ? "" : n).trim();
  if (t.length < 1 || t.length > 60) return false;
  if (!/[\p{L}\p{N}]/u.test(t)) return false;
  return RESERVED_NAMES.indexOf(t.replace(/[^\p{L}\p{N}]/gu, "").toLowerCase()) === -1;

const NAME_ERROR = "Please use your real name or a nickname \u2014 \u201Cnull\u201D and similar placeholders aren\u2019t allowed.";
function passwordProblems(pw, email) {
  const p = [];
  if (pw.length < 10) p.push("at least 10 characters");
  if (!/[a-z]/.test(pw) || !/[A-Z]/.test(pw)) p.push("upper and lower case letters");
  if (!/\d/.test(pw)) p.push("a number");
  if (COMMON_PASSWORDS.includes(pw.toLowerCase())) p.push("not a commonly used password");
  const local = String(email || "").split("@")[0].toLowerCase();
  if (local.length >= 4 && pw.toLowerCase().includes(local)) p.push("not contain your email name");
  return p;
}
function passwordStrength(pw) {
  let s = 0;
  if (pw.length >= 10) s++;
  if (pw.length >= 14) s++;
  if (/[a-z]/.test(pw) && /[A-Z]/.test(pw)) s++;
  if (/\d/.test(pw)) s++;
  if (/[^A-Za-z0-9]/.test(pw)) s++;
  return Math.min(4, s);

// UX only, NOT a security control: it just gives clear feedback after repeated wrong guesses. It
// runs in the visitor's browser, so anyone can bypass it. The real limit is Supabase's server-side one.
function makeThrottle(max, lockMs) {
  let fails = 0, until = 0;
  return {
    wait() { return Math.max(0, Math.ceil((until - Date.now()) / 1000)); },
    fail() { fails++; if (fails >= max) { until = Date.now() + lockMs * Math.min(8, fails - max + 1); } },
    ok() { fails = 0; until = 0; }
  };

const loginThrottle = makeThrottle(5, 30000);
// Sliding-window limit on how often an action can be repeated (same UX-only caveat as above).
// take() returns 0 and records the action if it is allowed, otherwise the seconds left to wait.
function makeRateLimiter(max, windowMs) {
  let hits = [];
  return {
    take() {
      const now = Date.now();
      hits = hits.filter((t) => now - t < windowMs);
      if (hits.length >= max) return Math.ceil((hits[0] + windowMs - now) / 1000);
      hits.push(now);
      return 0;
    }
  };
}
const commentLimiter = makeRateLimiter(3, 60 * 1000);        // 3 comments per minute
const pageCommentLimiter = makeRateLimiter(5, 60 * 1000);    // 5 reader page comments per minute
const contactLimiter = makeRateLimiter(3, 5 * 60 * 1000);    // 3 contact messages per 5 minutes
const signupLimiter = makeRateLimiter(3, 10 * 60 * 1000);    // 3 account sign-ups per 10 minutes
const fanartLimiter = makeRateLimiter(5, 10 * 60 * 1000);    // 5 fan art submissions per 10 minutes
const bookUploadLimiter = makeRateLimiter(10, 5 * 60 * 1000); // 10 admin book uploads per 5 minutes
const bookOpenLimiter = makeRateLimiter(20, 60 * 1000);      // 20 book downloads per minute

async function signUpReader(email, password) {
  const { data, error } = await sb.auth.signUp({ email, password });
  if (error) throw error;
  return data;
}
async function signInReader(email, password) {
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) throw error;
  return data;
}
async function signOutReader() {
  const { error } = await sb.auth.signOut();
  if (error) throw error;
}
async function fetchReaderProfile(userId) {
  const { data, error } = await sb.from("profiles").select("*").eq("id", userId).maybeSingle();
  if (error) throw error;
  return data;
}

// ---------------------------------------------------------------------------
// Permanent site library (Supabase-backed)
//
// Books uploaded by an admin are stored as:
//   - the extracted text  -> Supabase Storage bucket "book-content"
//   - the cover image     -> Supabase Storage bucket "book-covers" (optional)
//   - metadata + a pointer to both of the above -> the "books" Postgres table
// Row Level Security on "books" and on both buckets is what actually enforces
// "only admins can write" - it isn't just a hidden button in the UI. See the
// SQL you ran for the exact policies.

async function sha256Hex(text) {
  const bytes = new TextEncoder().encode(text);
  const digest = await crypto.subtle.digest("SHA-256", bytes);
  return Array.from(new Uint8Array(digest)).map((b) => b.toString(16).padStart(2, "0")).join("");
}

// Only these image types may be uploaded (no SVG: it can carry scripts). The database/Storage
// settings enforce the same list; this check gives a clear message before anything is sent.
const ALLOWED_IMAGE_TYPES = ["image/jpeg", "image/png", "image/webp"];
const IMAGE_ACCEPT = ALLOWED_IMAGE_TYPES.join(",");
const IMAGE_TYPE_ERROR = "Only JPEG, PNG or WebP images can be uploaded.";
// Works out the real type from the file's first bytes. The "data:image/..." header is typed by
// whoever made the file, so it is not trusted.
function sniffImageType(bytes) {
  const ascii = (from, to) => String.fromCharCode.apply(null, Array.prototype.slice.call(bytes, from, to));
  if (bytes.length > 3 && bytes[0] === 0xFF && bytes[1] === 0xD8 && bytes[2] === 0xFF) return "image/jpeg";
  if (bytes.length > 8 && bytes[0] === 0x89 && ascii(1, 4) === "PNG" && bytes[4] === 0x0D && bytes[5] === 0x0A && bytes[6] === 0x1A && bytes[7] === 0x0A) return "image/png";
  if (bytes.length > 12 && ascii(0, 4) === "RIFF" && ascii(8, 12) === "WEBP") return "image/webp";
  return null;
}
function dataUrlToBlob(dataUrl) {
  const base64 = String(dataUrl).split(",")[1];
  const binary = atob(base64 || "");
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  const mime = sniffImageType(bytes);
  if (!mime || ALLOWED_IMAGE_TYPES.indexOf(mime) === -1) throw new Error(IMAGE_TYPE_ERROR);
  return new Blob([bytes], { type: mime });
}

async function findSiteBookByHash(hash) {
  const { data, error } = await sb.from("books").select("id, title").eq("content_hash", hash).maybeSingle();
  if (error) throw error;
  return data;
}
async function uploadBookContentToStorage(text, hash) {
  const path = hash + ".txt";
  const { error } = await sb.storage.from("book-content").upload(path, new Blob([text], { type: "text/plain" }), {
    upsert: false,
    contentType: "text/plain"
  });
  if (error && !/already exists/i.test(error.message || "")) throw error;
  return path;
}
async function uploadDataUrlImage(bucket, makePath, dataUrl) {
  const blob = dataUrlToBlob(dataUrl);
  const ext = blob.type.split("/")[1] || "jpg";
  const path = makePath(ext);
  const { error } = await sb.storage.from(bucket).upload(path, blob, { upsert: false, contentType: blob.type });
  if (error) throw error;
  return path;
}
async function uploadBookCoverToStorage(dataUrl, hash) {
  return uploadDataUrlImage("book-covers", (ext) => hash + "-" + Date.now() + "." + ext, dataUrl);
}
function publicBookContentUrl(path) {
  return sb.storage.from("book-content").getPublicUrl(path).data.publicUrl;
}
function publicBookCoverUrl(path) {
  return sb.storage.from("book-covers").getPublicUrl(path).data.publicUrl;
}
async function fetchBookTextFromStorage(storagePath) {
  const res = await fetch(publicBookContentUrl(storagePath));
  if (!res.ok) throw new Error("Couldn't load this book's text from storage.");
  return res.text();
}
async function fetchSiteBookRows() {
  const { data, error } = await sb.from("books").select("*").eq("status", "published").order("created_at", { ascending: true });
  if (error) throw error;
  return data || [];
}
async function insertSiteBookRow(row) {
  const { data, error } = await sb.from("books").insert(row).select().single();
  if (error) throw error;
  return data;
}
async function deleteSiteBookRow(book) {
  const { data, error } = await sb.from("books").delete().eq("id", book.id).select("id");
  if (error) throw error;
  if (!data || !data.length) throw new Error("permission denied: nothing was deleted (this account is not an admin, or the book is already gone).");
  if (book.storage_path) await sb.storage.from("book-content").remove([book.storage_path]).catch(() => {});
  if (book.cover_path) await sb.storage.from("book-covers").remove([book.cover_path]).catch(() => {});
  await sb.from("page_comments").delete().eq("book_id", String(book.id)).catch(() => {});
}
// Per-page reader comments (Supabase table "page_comments"). Each comment is anchored to a text
// offset in the book rather than a page number, so it stays on the same passage however the
// reader's screen size re-flows the pages.
async function fetchPageComments(bookId) {
  const { data, error } = await sb.from("page_comments").select("*").eq("book_id", String(bookId)).order("created_at", { ascending: true }).limit(1000);
  if (error) throw error;
  return data || [];
}
async function insertPageComment(row) {
  const { data, error } = await sb.from("page_comments").insert(row).select().single();
  if (error) throw error;
  return data;
}
async function deletePageCommentRow(id) {
  const { data, error } = await sb.from("page_comments").delete().eq("id", id).select("id");
  if (error) throw error;
  if (!data || !data.length) throw new Error("permission denied: nothing was deleted.");
}

// Fanart gallery - readers submit art, it's queued as "pending" until an admin
// (profiles.role === 'admin' via RLS) approves it, then it shows up for everyone.
async function fetchFanartRows(onlyMine, userId) {
  let query = sb.from("fanart").select("*").eq("status", "approved").order("created_at", { ascending: false });
  if (onlyMine) query = query.eq("uploaded_by", userId);
  const { data, error } = await query;
  if (error) throw error;
  return data || [];
}
async function uploadFanartImageToStorage(dataUrl, userId) {
  // Storage policy: uploads must be inside the uploader's own folder
  return uploadDataUrlImage("fanart", (ext) => userId + "/" + Date.now() + "." + ext, dataUrl);
}
function publicFanartUrl(path) {
  return sb.storage.from("fanart").getPublicUrl(path).data.publicUrl;
}
async function insertFanartRow(row) {
  const { data, error } = await sb.from("fanart").insert(row).select().single();
  if (error) throw error;
  return data;
}
async function deleteFanartRow(item) {
  const { data, error } = await sb.from("fanart").delete().eq("id", item.id).select("id");
  if (error) throw error;
  if (!data || !data.length) throw new Error("permission denied: nothing was deleted (you can only delete your own fanart).");
  if (item.image_path) await sb.storage.from("fanart").remove([item.image_path]).catch(() => {});
}
// Admin moderation: every submission regardless of status, plus the ability to
// flip a pending one to "approved" so it starts showing up in the public gallery.
async function fetchAllFanartRows() {
  const { data, error } = await sb.from("fanart").select("*").order("created_at", { ascending: false });
  if (error) throw error;
  return data || [];
}
// Best-effort write to the server-side audit table. A failure never blocks the admin action.
async function recordAdminAudit(action, target) {
  try { await sb.from("admin_audit").insert({ action: String(action).slice(0, 80), target: String(target || "").slice(0, 300) }); } catch (err) {}
}
async function approveFanartRow(id) {
  const { data, error } = await sb.from("fanart").update({ status: "approved" }).eq("id", id).select("id");
  if (error) throw error;
  if (!data || !data.length) throw new Error("permission denied: nothing was approved (only admins can approve fanart).");
}
// Converts a raw Supabase "books" row into the {title, author, cover, content, ...}
// shape the existing reader UI already expects, with `content` left unloaded
// (fetched on demand when the reader actually opens the book).
function siteRowToBook(row) {
  return {
    id: row.id,
    title: row.title,
    author: row.author,
    badge: row.badge || "",
    desc: row.description || "",
    cover: row.cover_path ? publicBookCoverUrl(row.cover_path) : null,
    content: null,
    _storagePath: row.storage_path,
    _isSiteBook: true,
    shelf_id: row.shelf_id,
    shelf_title: row.shelf_title
  };
}
function mergeSiteBooksIntoShelves(prevShelves, rows) {
  let next = prevShelves.map((s) => ({ ...s, books: s.books.filter((b) => !b._isSiteBook) }));
  for (const row of rows) {
    const book = siteRowToBook(row);
    const idx = next.findIndex((s) => s.id === row.shelf_id);
    if (idx === -1) {

const KNOWN_PAGES = ["home", "browse", "upload", "authors", "fanart", "comments", "contact", "admin", "admin-login", "privacy-policy", "terms-and-conditions", "cookie-policy"];
function routeFromHash() {
  let raw = "";
  try { raw = decodeURIComponent((window.location.hash || "").replace(/^#\/?/, "")); } catch (err) { raw = ""; }
  if (!raw) return { page: "home", missing: "" };
  const id = raw.toLowerCase();
  return KNOWN_PAGES.indexOf(id) !== -1 ? { page: id, missing: "" } : { page: "not-found", missing: raw.slice(0, 80) };
}

            ),
            E("label", { style: { display: "flex", alignItems: "center", gap: 10, fontSize: 14, cursor: "pointer" } },
              E("input", { type: "checkbox", checked: !!(legalDraft || legalConfig).marketingEnabled, onChange: (e) => updateLegalField("marketingEnabled", e.target.checked) }),
              "Offer visitors a Marketing cookie category"
            )
          ),
          E("div", { style: { display: "flex", alignItems: "center", gap: 14 } },
            E("button", { type: "submit", style: { ...btn, border: "none", alignSelf: "flex-start" } }, "Save legal settings"),
            legalSaved && E("span", { style: { color: c.accent, fontSize: 14 } }, legalSaved)
          )
        )
      )
    )
  ),
  page === "fanart" && FanartPage({
    c, btn, inputStyle, readerUser, isAdmin,
    fanartItems, fanartLoading, fanartError, fanartFilter, setFanartFilter,
    fanartLightbox, openFanartLightbox, closeFanartLightbox,
    fanartFormOpen, openFanartComposer, closeFanartComposer,
    fanartForm, setFanartForm, fanartFormErrors, handleFanartImageChange,
    submitFanartUpload, fanartSubmitBusy, fanartSubmitSuccess,
    deleteFanartItem, fanartDeleteBusy
  }),
  page === "not-found" && E("section", { style: { padding: "90px 0 110px" } },
    E("div", { className: "mg-container", style: { maxWidth: 640, margin: "0 auto", padding: "0 32px", textAlign: "center" } },
      E("div", { className: "mg-display", "aria-hidden": "true", style: { fontSize: "clamp(88px, 22vw, 168px)", lineHeight: 1, letterSpacing: "0.04em", color: c.accent, opacity: 0.9 } }, "404"),
      E("div", { style: { display: "flex", alignItems: "center", gap: 10, margin: "14px auto 22px", maxWidth: 260 } },
        E("div", { style: { flex: 1, height: 1, background: c.lineStrong } }),
        E("span", { style: { fontSize: 12, color: c.accent, lineHeight: 1 } }, "\u2726"),
        E("div", { style: { flex: 1, height: 1, background: c.lineStrong } })
      ),
      E("h1", { className: "mg-display", style: { fontSize: "clamp(26px, 5vw, 34px)", marginBottom: 12 } }, "This page isn't on the shelf"),
      E("p", { style: { color: c.textSoft, fontSize: 17, maxWidth: "44ch", margin: "0 auto 8px" } }, "The page you were looking for has been moved, or it never existed. Let's get you back to something to read."),
      missingPath && E("p", { style: { color: c.textFaint, fontSize: 13, margin: "0 auto 26px", wordBreak: "break-all" } }, "Looked for: #" + missingPath),
      E("div", { style: { marginTop: missingPath ? 0 : 26, display: "flex", gap: 14, justifyContent: "center", flexWrap: "wrap" } },
        E("button", { type: "button", onClick: () => goTo("home"), style: { ...btn, border: "none" } }, "Back to home"),
        E("button", { type: "button", onClick: () => goTo("browse"), style: { background: "none", border: `1px solid ${c.line}`, color: "inherit", fontFamily: "'Source Serif 4', serif", fontSize: 15, padding: "12px 20px", borderRadius: 4, cursor: "pointer" } }, "Browse the shelves")
      )
    )
  ),
  page === "privacy-policy" && PrivacyPolicyPage({ legalConfig, page, goTo, theme }),
  page === "terms-and-conditions" && TermsPage({ legalConfig, page, goTo, theme }),
  page === "cookie-policy" && CookiePolicyPage({ legalConfig, page, goTo, theme }),
  deleteTarget && E("div", { style: { position: "fixed", inset: 0, background: "rgba(0,0,0,0.7)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 500, padding: 20 } },
    E("div", { style: { background: c.surface, border: `1px solid ${c.line}`, padding: 26, maxWidth: 420, width: "100%" } },
      E("h3", { className: "mg-display", style: { fontSize: 19, marginBottom: 10, color: c.danger } }, "Delete book?"),
      E("p", { style: { fontSize: 14, color: c.textSoft, marginBottom: 4 } }, "Book: " + deleteTarget.book.title),
      E("p", { style: { fontSize: 14, color: c.textSoft, marginBottom: 16 } }, "This will permanently remove this book from the website. This action cannot be undone."),
      E("label", { style: { fontSize: 13, color: c.textFaint, display: "block", marginBottom: 6 } }, "Type DELETE to confirm"),
      E("input", {
        type: "text", value: deleteConfirmText, onChange: (e) => setDeleteConfirmText(e.target.value),
        style: plainInputStyle
      }),
      E("label", { style: { fontSize: 13, color: c.textFaint, display: "block", marginBottom: 6 } }, "Admin password"),
      E("input", {
        type: "password", value: deletePassword, onChange: (e) => setDeletePassword(e.target.value),
        style: plainInputStyle
      }),
      deleteError && E("p", { style: { color: c.danger, fontSize: 13, marginBottom: 12 } }, deleteError),
      E("div", { style: { display: "flex", gap: 10, justifyContent: "flex-end" } },
        E("button", { type: "button", onClick: cancelDeleteBook, style: { background: "none", border: `1px solid ${c.line}`, color: "inherit", fontFamily: "'Source Serif 4', serif", fontSize: 14, padding: "9px 16px", borderRadius: 4, cursor: "pointer" } }, "Cancel"),
        E("button", { type: "button", onClick: confirmDeleteBook, disabled: deleteBusy, style: { background: c.danger, border: "none", color: "#fff", fontFamily: "'Source Serif 4', serif", fontSize: 14, padding: "9px 16px", borderRadius: 4, cursor: "pointer", opacity: deleteBusy ? 0.6 : 1 } }, deleteBusy ? "Deleting\u2026" : "Delete permanently")
      )
    )
  ),
  E("footer", { style: { borderTop: `1px solid ${c.line}`, padding: "40px 0 56px" } },
    E("div", { className: "mg-container", style: { maxWidth: 1120, margin: "0 auto", padding: "0 32px", display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 16 } },
      E("p", { style: { fontSize: 14, color: c.textFaint, margin: 0 } }, "\u00A9 " + new Date().getFullYear() + " " + legalConfig.websiteName + " \u2014 Built with care, not a feed"),
      E("nav", { style: { display: "flex", flexWrap: "wrap", gap: 18 } },
        [
          { label: "Privacy Policy", onClick: () => goTo("privacy-policy") },
          { label: "Terms & Conditions", onClick: () => goTo("terms-and-conditions") },
          { label: "Cookie Policy", onClick: () => goTo("cookie-policy") },
          { label: "Cookie Settings", onClick: openCookieSettings },
          { label: "Contact", onClick: () => goTo("contact") }
        ].map((l) => E("button", {
          key: l.label, type: "button", onClick: l.onClick,
          style: { background: "none", border: "none", color: c.textFaint, fontFamily: "'Source Serif 4', serif", fontSize: 13, cursor: "pointer", padding: 0, textDecoration: "underline" }
        }, l.label))
      )
    )
  ),
  siteLibraryError && E("div", {
    style: {
      position: "fixed", bottom: 18, left: "50%", transform: "translateX(-50%)", zIndex: 400,
      background: "#3a1f1f", color: "#f5c6c0", border: "1px solid #7a3b34", borderRadius: 8,
      padding: "10px 16px", fontSize: 13, display: "flex", alignItems: "center", gap: 12, maxWidth: "90vw"
    }
  },
    E("span", null, siteLibraryError),
    E("button", { type: "button", onClick: () => setSiteLibraryError(""), style: { background: "none", border: "none", color: "inherit", cursor: "pointer", fontSize: 15, lineHeight: 1 } }, "\u00D7")
  ),
  readerAuthOpen && E("div", { style: { position: "fixed", inset: 0, background: "rgba(0,0,0,0.7)", display: "flex", overflowY: "auto", zIndex: 500, padding: 20 }, onClick: () => setReaderAuthOpen(false) },
    E("div", { style: { width: "100%", maxWidth: 420, margin: "auto" }, onClick: (e) => e.stopPropagation() },
      E(BookAuthCard, {
        modal: true,
        chapter: readerAuthMode === "signup" ? "Chapter I" : "Chapter II",
        title: readerAuthMode === "signup" ? "Begin your story" : "Welcome back",
        sub: readerAuthMode === "signup" ? "Create an account in a moment." : "Pick up where you left off.",
        pageNo: readerAuthMode === "signup" ? "1" : "2",
        email: readerAuthForm.email,
        onEmail: (e) => setReaderAuthForm((f) => ({ ...f, email: e.target.value })),
        emailAutoComplete: "email",
        password: readerAuthForm.password,
        onPassword: (e) => setReaderAuthForm((f) => ({ ...f, password: e.target.value })),
        passwordAutoComplete: readerAuthMode === "signup" ? "new-password" : "current-password",
        strengthNode: readerAuthMode === "signup" && readerAuthForm.password ? (function () {
          const sc = passwordStrength(readerAuthForm.password);
          const labels = ["Very weak", "Weak", "Fair", "Good", "Strong"];
          const cols = ["#E58A8A", "#E58A8A", "#D8B468", "#9CC27A", "#6DBE8C"];
          return E("div", { className: "ba-strength" },
            E("div", { className: "ba-strength-bars" }, [0, 1, 2, 3].map((n) => E("span", { key: n, style: { background: n < sc ? cols[sc] : "rgba(231,223,200,0.16)" } }))),
            E("span", null, labels[sc] + " \u2014 10+ characters, upper and lower case, and a number")
          );
        })() : null,
        showTerms: readerAuthMode === "signup",
        terms: readerAuthTerms,
        onTerms: setReaderAuthTerms,
        onOpenLegal: (pg) => { setReaderAuthOpen(false); goTo(pg); },
        error: readerAuthError,
        notice: readerAuthNotice,
        busy: readerAuthBusy,
        busyLabel: "Please wait\u2026",
        submitLabel: readerAuthMode === "signup" ? "Sign up" : "Log in",
        onSubmit: submitReaderAuth,
        switchPrompt: readerAuthMode === "signup" ? "Already have an account?" : "New here?",
        switchLabel: readerAuthMode === "signup" ? "Log in" : "Sign up",
        onSwitch: () => { setReaderAuthMode((m) => (m === "signup" ? "signin" : "signup")); setReaderAuthError(""); setReaderAuthNotice(""); }
      })
    )
  ),
  showCookieBanner && CookieConsentBanner({
    legalConfig,
    onAcceptAll: acceptAllCookies,
    onRejectOptional: rejectOptionalCookies,
    onOpenPreferences: () => setCookiePrefsOpen(true),
    goTo
  }),
  cookiePrefsOpen && CookiePreferencesModal({
    legalConfig,
    draft: cookieDraft,
    onChange: (cat, v) => setCookieDraft((d) => ({ ...d, [cat]: v })),
    onSave: saveCookiePreferences,
    onAcceptAll: acceptAllCookies,
    onRejectOptional: rejectOptionalCookies,
    onClose: () => setCookiePrefsOpen(false)
  }),
  rateNotice && E("div", { role: "alert", style: { position: "fixed", left: "50%", bottom: 24, transform: "translateX(-50%)", background: c.surface, color: c.text, border: `1px solid ${c.danger}`, borderRadius: 6, padding: "12px 18px", fontSize: 14, maxWidth: "90vw", zIndex: 900, boxShadow: "0 8px 24px rgba(0,0,0,0.35)" } }, rateNotice),
  readingBook && E(BookReader, { book: readingBook, onClose: () => setReadingBook(null), readerUser: readerUser, onSignIn: () => openReaderAuth("signin"), isAdmin: isAdmin, onDeleteBook: () => requestDeleteBook(shelves.find((s) => s.books.some((b) => b.title === readingBook.title)) ? shelves.find((s) => s.books.some((b) => b.title === readingBook.title)).id : shelves[0].id, readingBook) }));
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(InkAndSpine));
</script>
